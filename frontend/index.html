<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - BillEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="dashboard" data-title="Dashboard" data-subtitle="Welcome back! Here's how your store is doing.">

<main class="main">
    <div class="content">

        <!-- KPI cards -->
        <div class="row g-3 mb-3">
            <div class="col-sm-6 col-xl-3">
                <div class="panel hero stat">
                    <div class="stat-icon"><i class="bi bi-currency-rupee"></i></div>
                    <div>
                        <div class="stat-label">Total Revenue</div>
                        <div class="stat-value" id="kpiRevenue">-</div>
                        <div class="stat-note" id="kpiRevenueNote">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="panel stat">
                    <div class="stat-icon tone-success"><i class="bi bi-graph-up-arrow"></i></div>
                    <div>
                        <div class="stat-label">Today's Sales</div>
                        <div class="stat-value" id="kpiToday">-</div>
                        <div class="stat-note" id="kpiTodayNote">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="panel stat">
                    <div class="stat-icon tone-primary"><i class="bi bi-box-seam"></i></div>
                    <div>
                        <div class="stat-label">Products</div>
                        <div class="stat-value" id="kpiProducts">-</div>
                        <div class="stat-note" id="kpiProductsNote">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="panel stat">
                    <div class="stat-icon tone-danger"><i class="bi bi-exclamation-triangle"></i></div>
                    <div>
                        <div class="stat-label">Low Stock</div>
                        <div class="stat-value" id="kpiLow">-</div>
                        <div class="stat-note" id="kpiLowNote">&nbsp;</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row g-3 mb-3">
            <div class="col-xl-8">
                <div class="panel h-100">
                    <div class="panel-header">
                        <div>
                            <h2>Revenue - Last 7 Days</h2>
                            <p id="weekTotal">&nbsp;</p>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div style="height: 280px"><canvas id="revenueChart"></canvas></div>
                    </div>
                </div>
            </div>
            <div class="col-xl-4">
                <div class="panel h-100">
                    <div class="panel-header">
                        <div>
                            <h2>Sales by Category</h2>
                            <p>Share of total revenue</p>
                        </div>
                    </div>
                    <div class="panel-body">
                        <div id="categoryChartBox" style="height: 280px"><canvas id="categoryChart"></canvas></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Lists -->
        <div class="row g-3">
            <div class="col-lg-6 col-xl-4">
                <div class="panel h-100">
                    <div class="panel-header">
                        <div>
                            <h2>Top Selling Products</h2>
                            <p>By units sold</p>
                        </div>
                    </div>
                    <div class="panel-body" id="topProducts"></div>
                </div>
            </div>
            <div class="col-lg-6 col-xl-4">
                <div class="panel h-100">
                    <div class="panel-header">
                        <div>
                            <h2>Low Stock Alert</h2>
                            <p id="thresholdText">&nbsp;</p>
                        </div>
                        <a href="stock.html" class="btn btn-light btn-sm">Restock</a>
                    </div>
                    <div class="panel-body" id="lowStockList"></div>
                </div>
            </div>
            <div class="col-xl-4">
                <div class="panel h-100">
                    <div class="panel-header">
                        <div>
                            <h2>Recent Sales</h2>
                            <p>Latest bills</p>
                        </div>
                        <a href="sales.html" class="btn btn-light btn-sm">View all</a>
                    </div>
                    <div class="panel-body" id="recentSales"></div>
                </div>
            </div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="js/common.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
