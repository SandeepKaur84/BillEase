<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Stock - BillEase</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/base.css" rel="stylesheet">
    <link href="../assets/css/layout.css" rel="stylesheet">
    <link href="../assets/css/components.css" rel="stylesheet">
</head>
<body data-page="stock" data-title="Stock" data-subtitle="Track stock levels and restock products.">

<main class="main">
    <div class="content">

        <!-- Summary tiles -->
        <div class="row g-3 mb-3">
            <div class="col-6 col-xl-3">
                <div class="panel stat">
                    <div class="stat-icon tone-primary"><i class="bi bi-boxes"></i></div>
                    <div>
                        <div class="stat-label">Total Units</div>
                        <div class="stat-value" id="totalUnits">-</div>
                        <div class="stat-note" id="stockValue">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-xl-3">
                <div class="panel stat">
                    <div class="stat-icon tone-success"><i class="bi bi-check2-circle"></i></div>
                    <div>
                        <div class="stat-label">In Stock</div>
                        <div class="stat-value" id="inStockCount">-</div>
                        <div class="stat-note">Products</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-xl-3">
                <div class="panel stat">
                    <div class="stat-icon tone-warning"><i class="bi bi-exclamation-triangle"></i></div>
                    <div>
                        <div class="stat-label">Low Stock</div>
                        <div class="stat-value" id="lowCount">-</div>
                        <div class="stat-note" id="thresholdNote">&nbsp;</div>
                    </div>
                </div>
            </div>
            <div class="col-6 col-xl-3">
                <div class="panel stat">
                    <div class="stat-icon tone-danger"><i class="bi bi-x-octagon"></i></div>
                    <div>
                        <div class="stat-label">Out of Stock</div>
                        <div class="stat-value" id="outCount">-</div>
                        <div class="stat-note">Can't be sold</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="panel">
            <div class="toolbar">
                <div class="segmented" id="filterTabs">
                    <button class="active" data-filter="all">All</button>
                    <button data-filter="low">Low stock</button>
                    <button data-filter="out">Out of stock</button>
                </div>
                <div class="search-box ms-auto" style="min-width: 240px">
                    <i class="bi bi-search"></i>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search products">
                </div>
            </div>
            <div class="table-wrap">
                <table class="table-modern">
                    <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th style="width: 26%">Stock Level</th>
                        <th>Status</th>
                        <th style="width: 210px">Restock</th>
                    </tr>
                    </thead>
                    <tbody id="stockTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/format.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/layout.js"></script>
<script src="../assets/js/pages/stock.js"></script>
</body>
</html>
