<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products - BillEase</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/base.css" rel="stylesheet">
    <link href="../assets/css/layout.css" rel="stylesheet">
    <link href="../assets/css/components.css" rel="stylesheet">
</head>
<body data-page="products" data-title="Products" data-subtitle="Add, edit and organise everything you sell.">

<main class="main">
    <div class="content">
        <div class="panel">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="search-box flex-grow-1" style="max-width: 360px">
                    <i class="bi bi-search"></i>
                    <input type="text" class="form-control" id="searchInput" placeholder="Search by product name or ID">
                </div>
                <select class="form-select" id="categoryFilter" style="width: auto">
                    <option value="">All categories</option>
                </select>
                <span class="text-muted small ms-1" id="productCount"></span>
                <button class="btn btn-primary ms-auto" id="addBtn">
                    <i class="bi bi-plus-lg me-1"></i>Add Product
                </button>
            </div>

            <!-- Table -->
            <div class="table-wrap">
                <table class="table-modern">
                    <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th class="text-end">Price</th>
                        <th>Stock</th>
                        <th class="text-end">Stock Value</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="productTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<!-- Add / Edit modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <form id="productForm" novalidate>
                <div class="modal-header">
                    <div>
                        <h5 class="modal-title" id="modalTitle">Add Product</h5>
                        <div class="text-muted small" id="modalSubtitle">Fill in the product details</div>
                    </div>
                    <button type="button" class="btn-close" data-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="productId">
                    <div class="mb-3">
                        <label class="form-label" for="name">Product name</label>
                        <input type="text" class="form-control" id="name" maxlength="100" required
                               placeholder="e.g. Notebook A4">
                        <div class="invalid-feedback">Product name is required</div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="category">Category</label>
                        <input type="text" class="form-control" id="category" maxlength="50" list="categoryList"
                               required placeholder="e.g. Stationery">
                        <datalist id="categoryList"></datalist>
                        <div class="invalid-feedback">Category is required</div>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label" for="price">Price</label>
                            <div class="input-group has-validation">
                                <span class="input-group-text">&#8377;</span>
                                <input type="number" class="form-control" id="price" min="0" step="0.01" required
                                       placeholder="0.00">
                                <div class="invalid-feedback">Price must be 0 or more</div>
                            </div>
                        </div>
                        <div class="col-6">
                            <label class="form-label" for="quantity">Quantity in stock</label>
                            <input type="number" class="form-control" id="quantity" min="0" step="1" required
                                   placeholder="0">
                            <div class="invalid-feedback">Whole number, 0 or more</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="saveBtn">Save Product</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/format.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/layout.js"></script>
<script src="../assets/js/pages/products.js"></script>
</body>
</html>
