<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>New Bill - BillEase</title>
    <link rel="icon" type="image/svg+xml" href="../assets/img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="../assets/css/base.css" rel="stylesheet">
    <link href="../assets/css/layout.css" rel="stylesheet">
    <link href="../assets/css/components.css" rel="stylesheet">
    <link href="../assets/css/billing.css" rel="stylesheet">
</head>
<body data-page="billing" data-title="New Bill" data-subtitle="Tap products to add them to the bill.">

<main class="main">
    <div class="content">
        <div class="row g-4">

            <!-- Left: product picker -->
            <div class="col-lg-7 col-xl-8">
                <div class="panel">
                    <div class="panel-body">
                        <div class="search-box mb-3">
                            <i class="bi bi-upc-scan"></i>
                            <input type="text" class="form-control form-control-lg" id="productSearch"
                                   placeholder="Search by name or ID, press Enter to add" autofocus>
                        </div>
                        <div class="filter-chips mb-3" id="categoryChips"></div>
                        <div class="product-grid" id="productGrid"></div>
                    </div>
                </div>
            </div>

            <!-- Right: current bill -->
            <div class="col-lg-5 col-xl-4">
                <div class="panel cart-panel">
                    <div class="panel-header pb-3" style="border-bottom: 1px solid var(--border)">
                        <div>
                            <h2><i class="bi bi-cart3 me-2"></i>Current Bill</h2>
                            <p id="cartCount">No items</p>
                        </div>
                        <button class="btn btn-light btn-sm" id="clearBtn" disabled>
                            <i class="bi bi-trash3 me-1"></i>Clear
                        </button>
                    </div>

                    <div class="cart-items" id="cartItems"></div>

                    <div class="cart-summary">
                        <div class="summary-row"><span>Items</span><span id="itemCount">0</span></div>
                        <div class="summary-row"><span>Subtotal</span><span id="subtotal">&#8377;0.00</span></div>
                        <div class="grand-total">
                            <span class="fw-bold">Grand Total</span>
                            <span id="grandTotal">&#8377;0.00</span>
                        </div>
                        <button class="btn btn-success btn-checkout" id="checkoutBtn" disabled>
                            <i class="bi bi-receipt me-2"></i>Generate Bill
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<script src="../assets/js/core/api.js"></script>
<script src="../assets/js/core/format.js"></script>
<script src="../assets/js/core/ui.js"></script>
<script src="../assets/js/core/layout.js"></script>
<script src="../assets/js/pages/billing.js"></script>
</body>
</html>
