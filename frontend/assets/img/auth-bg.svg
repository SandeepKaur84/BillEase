<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <!-- BillEase log in / sign up background: indigo-to-violet gradient,
       soft glows, a dotted grid, receipts, a bar chart and a coin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#312e81"/>
      <stop offset="0.45" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.8" cy="0.15" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.1" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glowA)"/>
  <rect width="800" height="1000" fill="url(#glowB)"/>
  <rect width="800" height="1000" fill="url(#dots)"/>

  <!-- Large rings -->
  <circle cx="690" cy="860" r="230" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <circle cx="690" cy="860" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="70" cy="120" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>

  <!-- Receipt, top right -->
  <g transform="translate(520 90) rotate(12)">
    <path d="M0 0h190v250l-19-12-19 12-19-12-19 12-19-12-19 12-19-12-19 12-19-12-19 12z"
          fill="url(#paper)" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>
    <rect x="22" y="26" width="90" height="12" rx="6" fill="#ffffff" fill-opacity="0.55"/>
    <rect x="22" y="62" width="120" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="22" y="86" width="100" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <rect x="22" y="110" width="130" height="8" rx="4" fill="#ffffff" fill-opacity="0.3"/>
    <line x1="22" y1="146" x2="168" y2="146" stroke="#ffffff" stroke-opacity="0.35" stroke-dasharray="5 5"/>
    <rect x="22" y="166" width="60" height="10" rx="5" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="110" y="162" width="58" height="18" rx="6" fill="#ffffff" fill-opacity="0.6"/>
  </g>

  <!-- Bar chart card, middle right -->
  <g transform="translate(500 420) rotate(-8)">
    <rect width="230" height="160" rx="18" fill="url(#paper)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="20" y="20" width="80" height="10" rx="5" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="28" y="96" width="22" height="44" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="66" y="76" width="22" height="64" rx="5" fill="#ffffff" fill-opacity="0.45"/>
    <rect x="104" y="104" width="22" height="36" rx="5" fill="#ffffff" fill-opacity="0.35"/>
    <rect x="142" y="58" width="22" height="82" rx="5" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="180" y="44" width="22" height="96" rx="5" fill="#a5f3fc" fill-opacity="0.8"/>
  </g>

  <!-- Coin, lower right -->
  <g transform="translate(600 720)">
    <circle r="54" fill="#fbbf24" fill-opacity="0.9"/>
    <circle r="42" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M-16 -22h32M-16 -8h32M-16 -22c26 0 26 30 0 30l26 28"
          fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small receipt, bottom left -->
  <g transform="translate(150 790) rotate(-14)">
    <path d="M0 0h120v150l-15-10-15 10-15-10-15 10-15-10-15 10-15-10-15 10z"
          fill="url(#paper)" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>
    <rect x="16" y="20" width="60" height="9" rx="4.5" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="16" y="46" width="88" height="6" rx="3" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="16" y="64" width="70" height="6" rx="3" fill="#ffffff" fill-opacity="0.28"/>
    <rect x="16" y="98" width="88" height="12" rx="5" fill="#ffffff" fill-opacity="0.5"/>
  </g>

  <!-- Sparkles -->
  <g fill="#ffffff">
    <path d="M300 200l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill-opacity="0.5"/>
    <path d="M660 470l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill-opacity="0.45"/>
    <path d="M110 330l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill-opacity="0.4"/>
    <path d="M380 920l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill-opacity="0.35"/>
  </g>
</svg>
