<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BillEase">
  <!-- BillEase mark: a receipt with a green "paid" check, on the brand gradient.
       Used as the logo and as the browser-tab icon (favicon). -->
  <defs>
    <linearGradient id="be-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#be-bg)"/>
  <!-- Receipt with a zigzag tear at the bottom -->
  <path d="M17 17a3 3 0 0 1 3-3h24a3 3 0 0 1 3 3v33l-5-3.5-5 3.5-5-3.5-5 3.5-5-3.5-5 3.5z" fill="#ffffff"/>
  <rect x="22.5" y="21.5" width="19" height="3.5" rx="1.75" fill="#6366f1" fill-opacity="0.45"/>
  <rect x="22.5" y="29" width="12" height="3.5" rx="1.75" fill="#6366f1" fill-opacity="0.3"/>
  <!-- "Paid" check badge -->
  <circle cx="44" cy="43" r="10" fill="#10b981" stroke="#ffffff" stroke-width="3"/>
  <path d="M39.6 43.2l3 3 5.6-6" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
