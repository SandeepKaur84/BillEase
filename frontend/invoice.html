<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Invoice - BillEase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="sales" data-title="Invoice" data-subtitle="Print or save this bill for your customer.">

<main class="main">
    <div class="content">

        <div class="d-flex flex-wrap justify-content-center gap-2 mb-4 no-print">
            <button class="btn btn-primary" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>Print Invoice
            </button>
            <a href="billing.html" class="btn btn-success"><i class="bi bi-plus-lg me-1"></i>New Bill</a>
            <a href="sales.html" class="btn btn-light"><i class="bi bi-arrow-left me-1"></i>Sales History</a>
        </div>

        <div class="panel invoice d-none" id="invoice">
            <!-- Header -->
            <div class="invoice-top">
                <div>
                    <div class="brand mb-2">
                        <div class="brand-logo"><i class="bi bi-shop"></i></div>
                        <div id="storeName">My Store</div>
                    </div>
                    <div class="muted">123 Main Road, Your City</div>
                    <div class="muted">Phone: 98765 43210 &middot; store@example.com</div>
                </div>
                <div>
                    <div class="invoice-title">INVOICE</div>
                    <div class="muted text-end" id="invoiceNoTop"></div>
                </div>
            </div>

            <!-- Meta -->
            <div class="invoice-meta">
                <div>
                    <div class="label">Invoice No.</div>
                    <div class="value" id="invoiceNo"></div>
                </div>
                <div>
                    <div class="label">Date</div>
                    <div class="value" id="invoiceDate"></div>
                </div>
                <div>
                    <div class="label">Time</div>
                    <div class="value" id="invoiceTime"></div>
                </div>
                <div>
                    <div class="label">Status</div>
                    <div class="value"><span class="paid-stamp"><i class="bi bi-check-circle-fill"></i>PAID</span></div>
                </div>
            </div>

            <!-- Items -->
            <div class="invoice-body">
                <div class="table-wrap">
                    <table class="table-modern">
                        <thead>
                        <tr>
                            <th style="width: 50px">#</th>
                            <th>Item</th>
                            <th class="text-end">Price</th>
                            <th class="text-end">Qty</th>
                            <th class="text-end">Amount</th>
                        </tr>
                        </thead>
                        <tbody id="invoiceItems"></tbody>
                    </table>
                </div>

                <div class="invoice-totals">
                    <div class="row-line"><span>Total items</span><span id="invoiceUnits"></span></div>
                    <div class="row-line"><span>Subtotal</span><span id="invoiceSubtotal"></span></div>
                    <div class="total-line"><span>Grand Total</span><span id="invoiceTotal"></span></div>
                </div>
            </div>

            <!-- Footer -->
            <div class="invoice-footer">
                <span><i class="bi bi-heart-fill text-danger me-1"></i>Thank you for shopping with us!</span>
                <span>This is a computer-generated invoice.</span>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/common.js"></script>
<script src="js/invoice.js"></script>
</body>
</html>
