# ===== Server =====
server.port=8080

# ===== MySQL connection =====
# createDatabaseIfNotExist=true creates the "billease_db" database automatically on first run
spring.datasource.url=jdbc:mysql://localhost:3306/billease_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
# CHANGE THIS to your own MySQL root password
spring.datasource.password=root

# ===== JPA / Hibernate =====
# "update" creates/updates tables from the entity classes. Existing data is kept.
spring.jpa.hibernate.ddl-auto=update
# Print the SQL that Hibernate runs (useful for learning, turn off later)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== App settings =====
# Products with quantity at or below this number are "low stock"
app.low-stock-threshold=10
# How long a login lasts before the user must log in again
app.session-days=7
